<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APIGW API 스펙 참조</title>
  <script>(function(){var t=localStorage.getItem('wt-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;})();</script>
  <link rel="stylesheet" href="../shared/css/common.css">
  <script src="../shared/js/theme.js" defer></script>
  <style>
    .app { max-width: 1400px; padding: 24px 24px 60px; }

    /* 검색 */
    .search-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--color-bg);
      padding: 12px 0;
      margin-bottom: 8px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .search-input {
      flex: 1;
      padding: 9px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-card);
      color: var(--color-text);
      font-size: 0.9rem;
    }
    .search-input:focus { outline: none; border-color: var(--color-primary); }
    .match-count { font-size: 0.82rem; color: var(--color-text-muted); white-space: nowrap; }

    /* 서비스 섹션 */
    .service-section { margin-bottom: 28px; }
    .service-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--color-panel-header);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      cursor: pointer;
      user-select: none;
    }
    .service-header:hover { opacity: 0.85; }
    .service-name { font-weight: 700; font-size: 0.95rem; color: var(--color-text-heading); flex: 1; }
    .service-base { font-size: 0.78rem; color: var(--color-text-muted); font-family: var(--font-mono); }
    .service-count {
      font-size: 0.72rem; font-weight: 700; color: #fff;
      background: var(--color-primary); border-radius: 10px; padding: 2px 8px;
    }
    .collapse-icon { font-size: 0.72rem; color: var(--color-text-muted); }

    /* API 테이블 */
    .api-table-wrap {
      border: 1px solid var(--color-border);
      border-top: none;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      overflow: hidden;
    }
    .api-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
    .api-table tr:not(:last-child) td { border-bottom: 1px solid var(--color-border-subtle); }
    .api-table tr.hidden { display: none; }
    .api-table td { padding: 8px 12px; vertical-align: middle; }
    .api-table td:first-child { width: 100px; }
    .api-table td:nth-child(2) { width: 340px; font-family: var(--font-mono); font-size: 0.79rem; color: var(--color-text); }
    .api-table td:nth-child(3) { color: var(--color-text-label); }
    .api-table tr:hover td { background: color-mix(in srgb, var(--color-primary) 4%, transparent); }

    .method {
      display: inline-block; padding: 2px 8px;
      border-radius: 4px; font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.04em; min-width: 52px; text-align: center;
    }
    .m-get    { background: #e3f2fd; color: #1565c0; }
    .m-post   { background: #e8f5e9; color: #2e7d32; }
    .m-put    { background: #fff3e0; color: #e65100; }
    .m-patch  { background: #f3e5f5; color: #6a1b9a; }
    .m-delete { background: #fce4ec; color: #c62828; }
    .m-multi  { background: var(--color-border-subtle); color: var(--color-text-label); }

    [data-theme="dark"] .m-get    { background: #0d2137; color: #64b5f6; }
    [data-theme="dark"] .m-post   { background: #0d2b0d; color: #81c784; }
    [data-theme="dark"] .m-put    { background: #2b1a00; color: #ffb74d; }
    [data-theme="dark"] .m-patch  { background: #1e0d2b; color: #ce93d8; }
    [data-theme="dark"] .m-delete { background: #2b0d0d; color: #ef9a9a; }
    [data-theme="dark"] .m-multi  { background: #2a2a3a; color: #aaa; }

    .highlight { background: rgba(255,220,0,0.35); border-radius: 2px; }
    [data-theme="dark"] .highlight { background: rgba(255,200,0,0.2); }

    .no-results { text-align: center; padding: 60px 20px; color: var(--color-text-muted); }
  </style>
</head>
<body>

<nav class="tool-nav">
  <a href="../index.html">← Web Tools</a>

// ── 메서드 → CSS 클래스 ──
function methodClass(m) {
  const u = m.toUpperCase();
  if (u === 'GET')    return 'm-get';
  if (u === 'POST')   return 'm-post';
  if (u === 'PUT')    return 'm-put';
  if (u === 'PATCH')  return 'm-patch';
  if (u === 'DELETE') return 'm-delete';
  return 'm-multi';
}

// ── 렌더링 ──
const container = document.getElementById('container');
const collapsed  = {};

SERVICES.forEach((svc, si) => {
  const section = document.createElement('div');
  section.className = 'service-section';
  section.dataset.si = si;

  const header = document.createElement('div');
  header.className = 'service-header';
  header.innerHTML = `
    <span class="service-name">${svc.name}</span>
    <span class="service-base">${svc.base}</span>
    <span class="service-count">${svc.apis.length}</span>
    <span class="collapse-icon" id="ci-${si}">▼</span>`;
  header.addEventListener('click', () => toggleSection(si));

  const tableWrap = document.createElement('div');
  tableWrap.className = 'api-table-wrap';
  tableWrap.id = `tw-${si}`;

  const table = document.createElement('table');
  table.className = 'api-table';
  table.id = `t-${si}`;

  svc.apis.forEach(([method, path, desc], ri) => {
    const tr = document.createElement('tr');
    tr.dataset.method = method.toLowerCase();
    tr.dataset.path   = path.toLowerCase();
    tr.dataset.desc   = desc;
    tr.innerHTML = `
      <td><span class="method ${methodClass(method)}">${method}</span></td>
      <td>${path}</td>
      <td>${desc}</td>`;
    table.appendChild(tr);
  });

  tableWrap.appendChild(table);
  section.appendChild(header);
  section.appendChild(tableWrap);
  container.appendChild(section);
});

function toggleSection(si) {
  collapsed[si] = !collapsed[si];
  document.getElementById(`tw-${si}`).style.display = collapsed[si] ? 'none' : '';
  document.getElementById(`ci-${si}`).textContent = collapsed[si] ? '▶' : '▼';
}

// ── 검색 ──
function highlight(text, q) {
  if (!q) return text;
  return text.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'),
    m => `<span class="highlight">${m}</span>`);
}

function doSearch(raw) {
  const q = raw.trim().toLowerCase();
  let total = 0;

  SERVICES.forEach((svc, si) => {
    const rows = document.querySelectorAll(`#t-${si} tr`);
    let svcMatch = 0;

    rows.forEach((tr, ri) => {
      const api    = svc.apis[ri];
      const method = api[0].toLowerCase();
      const path   = api[1].toLowerCase();
      const desc   = api[2];
      const hit    = !q || method.includes(q) || path.includes(q) || desc.toLowerCase().includes(q);

      tr.classList.toggle('hidden', !hit);
      if (hit) {
        svcMatch++;
        tr.cells[0].innerHTML = `<span class="method ${methodClass(api[0])}">${highlight(api[0], raw.trim())}</span>`;
        tr.cells[1].innerHTML = highlight(api[1], raw.trim());
        tr.cells[2].innerHTML = highlight(desc, raw.trim());
      }
    });

    total += svcMatch;

    const section = document.querySelector(`.service-section[data-si="${si}"]`);
    if (!q) {
      section.style.display = '';
      if (collapsed[si]) document.getElementById(`tw-${si}`).style.display = 'none';
      else               document.getElementById(`tw-${si}`).style.display = '';
    } else {
      section.style.display = svcMatch ? '' : 'none';
      document.getElementById(`tw-${si}`).style.display = svcMatch ? '' : 'none';
    }
  });

  const matchEl = document.getElementById('matchCount');
  const noRes   = document.getElementById('noResults');
  if (q) {
    matchEl.textContent = `${total}개 일치`;
    noRes.style.display = total ? 'none' : '';
  } else {
    matchEl.textContent = '';
    noRes.style.display = 'none';
  }
}
